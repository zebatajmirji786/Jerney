services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - jerney-network
    restart: always

  backend:
    build: ./backend
    environment:
      DB_USER: postgres_user
      DB_PASSWORD: postgres_password
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
    restart: always
    networks:
      - jerney-network
    expose:
      - "5000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jerney-network

networks:
  jerney-network:
    driver: bridge

volumes:
  postgres-data:

